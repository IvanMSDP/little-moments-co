
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Moments Co.</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Georgia, serif;
  background: #fbf5f1;
  color: #59463f;
}
header {
  text-align: center;
  padding: 35px 15px;
  background: #f3e5df;
}
.logo {
  font-size: 32px;
  color: #b58b72;
}
nav { margin-top: 20px; }
nav a {
  color: #59463f;
  text-decoration: none;
  margin: 12px;
}
.hero {
  text-align: center;
  padding: 85px 20px;
}
.hero h1 { font-size: 42px; }
.hero p { font-size: 17px; }
.btn {
  display: inline-block;
  background: #bd967c;
  color: white;
  padding: 14px 28px;
  text-decoration: none;
  border-radius: 25px;
}
.products {
  padding: 35px 20px;
  text-align: center;
}
.product {
  background: white;
  padding: 25px;
  margin: 15px auto;
  max-width: 330px;
  border-radius: 15px;
}
footer {
  text-align: center;
  padding: 30px;
  background: #f3e5df;
}
</style>
</head>
<body>

<header>
  <div class="logo">Little Moments Co.</div>
  <p>by Ivanmyt</p>
  <nav>
    <a href="#inicio">Inicio</a>
    <a href="#productos">Productos</a>
    <a href="#contacto">Contacto</a>
  </nav>
</header>

<section class="hero" id="inicio">
  <h1>Make Every Moment Special ✨</h1>
  <p>Discover beautiful things for life's
  little moments.</p>
  <a class="btn" href="#productos">SHOP NOW</a>
</section>

<section class="products" id="productos">
  <h2>Our Collection</h2>

  <div class="product">
    <h3>Our Featured Products</h3>
    <p>Discover your next favorite item.</p>
    <a class="btn"
    href="https://TU-TIENDA.myshopify.com">
    Shop Now
    </a>
  </div>
</section>

<footer id="contacto">
  <p>Little Moments Co. by Ivanmyt</p>
  <p>Every little moment matters. ♡</p>
</footer>

</body>
</html>
